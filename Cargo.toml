[package]
name = "star-citizen-presence"
version = "0.1.4"
edition = "2021"
description = "Discord Rich Presence for Star Citizen based on Game.log"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ctrlc = "3.4"
discord-rich-presence = "0.2"
eframe = { version = "0.30", default-features = false, features = ["glow", "default_fonts"] }
h2 = "0.4"
http = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
prost = "0.13"
regex = "1.11"
self-replace = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "rt", "time"] }
toml = "0.8"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
ureq = { version = "2.10", features = ["json"] }
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Globalization",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
] }
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
